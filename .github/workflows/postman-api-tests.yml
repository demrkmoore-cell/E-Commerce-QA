name: Postman API Collection

on:
  push:
    paths:
      - 'api-tests/**'
      - '.github/workflows/postman-api-tests.yml'
  pull_request:
    paths:
      - 'api-tests/**'
      - '.github/workflows/postman-api-tests.yml'
  workflow_dispatch:

jobs:
  postman-collection:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Install Newman
        run: npm install --global newman

      - name: Run Postman collection against the public Demoblaze API
        run: >
          newman run api-tests/Demoblaze-API-Tests.postman_collection.json
          --reporters cli
          --timeout-request 20000
          --timeout-script 15000
