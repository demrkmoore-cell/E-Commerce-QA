name: Playwright UI Tests

on:
  push:
    paths:
      - 'ui-tests/**'
      - '.github/workflows/playwright-ui-tests.yml'
  pull_request:
    paths:
      - 'ui-tests/**'
      - '.github/workflows/playwright-ui-tests.yml'
  workflow_dispatch:

jobs:
  playwright-tests:
    name: Playwright tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04
          - windows-latest
          - macos-latest
    defaults:
      run:
        working-directory: ui-tests

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Install Playwright Chromium with Linux system dependencies
        if: runner.os == 'Linux'
        run: python -m playwright install --with-deps chromium

      - name: Install Playwright Chromium
        if: runner.os != 'Linux'
        run: python -m playwright install chromium

      - name: Run Playwright tests (headless)
        run: python -m pytest -v --browser chromium
